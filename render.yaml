services:
  - type: web
    name: mpm-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: KIS_APP_KEY
        sync: false
      - key: KIS_APP_SECRET
        sync: false
      - key: KIS_ACCOUNT_NO
        sync: false
      - key: KIS_IS_MOCK
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_USER_EMAIL
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"          # 일일 동기화 4회 + 섹터주도주
      - key: ENABLE_INTRADAY
        value: "false"         # 장중 10분 매매는 로컬에서만
      - key: PYTHON_VERSION
        value: "3.11.6"
